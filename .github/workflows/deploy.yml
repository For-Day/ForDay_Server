name: Deploy (Build & Push, GitOps)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트가 실제로 접속하는 Redis. 자세한 배경은 .github/workflows/test.yml 참고.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Create Firebase JSON
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "forday-2ae94-firebase-adminsdk-fbsvc-e11f290048.json"
          json: ${{ secrets.FIREBASE_JSON }}
          dir: "src/main/resources/"

      # application.yml/application-prod.yml은 이제 실제 값 없이 ${VAR} 플레이스홀더만
      # 담아 git에 커밋되어 있다(이슈 #390). 실제 값은 k8s Secret(ExternalSecret이
      # AWS Secrets Manager에서 동기화)으로 주입된다 - ForDay_GitOps 참고.

      # clean은 여기서 한 번만 한다. 뒤의 build가 컴파일 결과를 재사용하도록
      # 테스트와 빌드를 나눠 실행해, 실패 지점이 어느 단계인지 바로 드러나게 한다.
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Build Spring Boot
        run: ./gradlew build -x test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-northeast-2 \
          | docker login --username AWS --password-stdin 839983937363.dkr.ecr.ap-northeast-2.amazonaws.com

      # 이미지 태그를 커밋 SHA로 고정한다 - GitOps 흐름에서 ArgoCD가 새 배포를
      # 감지하려면 태그 자체가 매번 달라져야 한다("latest"처럼 고정 태그를
      # 재사용하면 values.yaml 내용이 안 바뀌어 아무 일도 일어나지 않는다).
      - name: Determine image tag
        id: image_tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Docker Image
        run: |
          IMAGE="839983937363.dkr.ecr.ap-northeast-2.amazonaws.com/forday"
          docker build -t forday .
          docker tag forday:latest "$IMAGE:${{ steps.image_tag.outputs.value }}"
          docker tag forday:latest "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.image_tag.outputs.value }}"
          docker push "$IMAGE:latest"

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ForDay_GitOps
        uses: actions/checkout@v4
        with:
          repository: For-Day/ForDay_GitOps
          # 별도 저장소(private)에 커밋해야 해서 기본 GITHUB_TOKEN(현재 저장소
          # 범위만 씀)으로는 안 되고, 쓰기 권한이 있는 PAT가 필요하다.
          token: ${{ secrets.GITOPS_PAT }}

      - name: Bump image tag in values.yaml
        run: |
          sed -i "s/^  tag: .*/  tag: ${{ needs.build.outputs.image_tag }}/" charts/forday-app/values.yaml
          grep "tag:" charts/forday-app/values.yaml

      - name: Commit & push
        run: |
          git config user.name "forday-ci"
          git config user.email "ci@forday.kr"
          git add charts/forday-app/values.yaml
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "deploy: forday-app image ${{ needs.build.outputs.image_tag }} (ForDay_Server@${{ github.sha }})"
            git push
          fi
