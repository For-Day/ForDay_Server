name: Test

on:
  pull_request:
    branches: [ "dev", "release", "main" ]
  push:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # @SpringBootTest는 application-test.yml의 localhost:6379에 실제로 접속한다.
    # DB는 H2 인메모리, RabbitMQ는 연결 실패해도 컨텍스트가 뜨므로 Redis만 띄운다.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # application.yml은 gitignore 대상이지만 테스트 컨텍스트가 플레이스홀더를
      # 읽으므로 배포와 동일하게 주입한다.
      - name: Create Firebase JSON
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "forday-2ae94-firebase-adminsdk-fbsvc-e11f290048.json"
          json: ${{ secrets.FIREBASE_JSON }}
          dir: "src/main/resources/"

      - name: Create application.yml
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yml

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
