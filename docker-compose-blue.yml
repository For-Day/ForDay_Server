version: '3.8'

services:
  blue:
    image: 839983937363.dkr.ecr.ap-northeast-2.amazonaws.com/forday:latest
    container_name: blue
    ports:
      - "8080:8080"
    # 서버의 이 파일과 같은 디렉토리에 .env(gitignore 대상, 실제 시크릿 값)를 둔다.
    # 템플릿은 .env.example 참고.
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=blue
      - ENV=blue
    restart: always
