plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springAiVersion = '1.1.8'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// DB
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway - 스키마 변경을 db/migration의 버전 파일로 관리한다. ddl-auto에 맡기면
	// 변경이 PR diff에 보이지 않고, 기존 컬럼 타입 변경이 반영되지 않는다.
	// flyway-mysql: Flyway 10 이후 MySQL 지원이 별도 모듈로 분리됐다.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	testRuntimeOnly 'com.h2database:h2'

	// MongoDB (이슈 #406~#408 - 알림/AI 이력 도메인 부분 도입)
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// querydsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// WebClient (AI 호출)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Spring AI (OpenAI) - 이슈 #385, FastAPI(LangChain) 대체
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// JSON 파싱
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// jdk (s3)
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.676'

	// measure 프로파일 전용 - "서버에서 동기로 리사이즈했다면" 가상 시나리오 재현/측정에만 쓴다.
	// 프로덕션은 Lambda가 리사이즈하므로 이 라이브러리를 실제 요청 경로에서 쓰지 않는다.
	implementation 'net.coobird:thumbnailator:0.4.20'

	// lambda invoke
	implementation platform("software.amazon.awssdk:bom:2.25.0")
	implementation "software.amazon.awssdk:lambda"

	// Firebase Admin SDK
	implementation 'com.google.firebase:firebase-admin:9.2.0'

	// RabbitMQ
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// 지표 노출 (이슈 #373 - docs/perf/metrics.md)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// ArchUnit (아키텍처 규칙 검증 - docs/architecture-rules.md)
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// 소스에 한글 문자열/식별자가 있어 인코딩을 명시하지 않으면
// 컴파일 결과와 테스트 리포트에서 한글이 깨진다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	// migration 태그는 실제 MySQL이 필요하므로 기본 test에서 제외한다. CI에서는
	// 별도 job(MySQL 서비스 컨테이너)이 migrationTest 태스크로 돌린다.
	useJUnitPlatform {
		excludeTags 'migration'
	}
	defaultCharacterEncoding = 'UTF-8'
	finalizedBy tasks.named('jacocoTestReport')
}

// db/migration이 실제 MySQL에 적용되는지, 그 결과가 엔티티와 맞는지만 검증한다.
// localhost:3306에 MySQL 8이 필요하다(CI: test.yml의 migration job).
tasks.register('migrationTest', Test) {
	description = 'Flyway 마이그레이션을 실제 MySQL에 적용하고 엔티티와 대조한다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'migration'
	}
	defaultCharacterEncoding = 'UTF-8'
}

// 커버리지 측정 대상을 스티커판 조회 로직으로 한정한다. 전체를 집계하면 인프라/설정
// 클래스가 섞여 "이 기능을 얼마나 덮었는가"라는 질문에 답하지 못한다.
// HobbyService는 무관한 메서드가 많아 제외하고, getStickerInfo의 분기가 모여 있는
// StickerContext를 중심으로 본다. $Builder 등 Lombok 생성 내부 클래스까지 포함하려고
// 클래스명 뒤에 와일드카드를 둔다.
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		html.required = true
		xml.required = true
	}
	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, includes: [
						'**/domain/hobby/dto/StickerContext*.class',
						'**/domain/hobby/dto/response/GetStickerInfoResDto*.class',
						'**/domain/record/service/StickerInfoCacheService*.class'
				])
			})
	)
}
