# 로컬 전용 값(빈 기본값)은 커밋해도 안전하다. 실제 키/자격증명은 여기 적지 않고
# 프로젝트 루트의 .env 파일(gitignore 대상)에 넣는다 - .env.example 참고.
server:
  port: 8080
  env: local
serverName: ForDay_local

spring:
  config:
    import:
      - optional:file:.env[.properties]
      # Spring Boot의 프로필별 파일 자동 로드 규칙은 application-{프로필명}.yml만
      # 찾는다. 배포는 SPRING_PROFILES_ACTIVE=blue/green을 쓰는데 파일명은
      # application-prod.yml이라 이름이 안 맞아 지금까지 이 파일이 전혀 로드되지
      # 않고 있었다(blue/green 전용 설정이 통째로 죽어 있던 상태 - 배포 사고로
      # 발견). 명시적으로 import해서 blue/green/common on-profile 문서가 실제로
      # 평가되게 한다. 로컬/테스트는 blue/green/common 프로필이 활성화되지 않으니
      # 이 파일을 가져와도 영향이 없다.
      - classpath:application-prod.yml

  profiles:
    # active가 아니라 default를 쓴다. active는 이 파일이 항상 로드되는 기본
    # 문서라 다른 어떤 프로필을 지정해도 "local"이 함께 활성화되는 문제가 있다
    # (배포 시 SPRING_PROFILES_ACTIVE=green을 줬는데도 응답이 local로 나온 사고
    # 원인). default는 외부에서 활성 프로필을 지정하지 않았을 때만 적용된다.
    default: local
  application:
    name: ForDay
    env: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/forday?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    # host/port/database를 분리한다(uri 대신). k8s에서는 자격증명(username/password)이
    # ExternalSecret에서 별도로 오므로 하나의 uri 문자열로 합쳐 넣을 수 없다 - prod쪽
    # 설정(application-prod.yml)과 형태를 맞춘다. 로컬은 인증 없는 MongoDB를 가정한다.
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:forday}
      # NotificationDocument의 @CompoundIndex(receiverId+id)가 기동 시 자동 생성되게 한다.
      # RDB의 ddl-auto:update가 스키마를 코드에 맞춰가는 것과 같은 목적.
      auto-index-creation: true

  jwt:
    secret: ${JWT_SECRET:local-only-dev-jwt-secret-do-not-use-in-prod-0000000000}
    access-expiration: 180 # 분 단위
    refresh-expiration: 14 # 일 단위

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-openai-api-key}
      base-url: https://api.openai.com/v1
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.6

ai:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.6 # 기존 FastAPI(LangChain) 체인의 ChatOpenAI temperature 값과 동일
  max-call-limit: 3

apple:
  client_id: com.example.forday
  team_id: ${APPLE_TEAM_ID:XXXXXXXX}
  key: ${APPLE_KEY_ID:YYYYYYYY}
  private_key: ${APPLE_PRIVATE_KEY:appleprivatekey}

cloud:
  aws:
    access-key: ${AWS_ACCESS_KEY:local-aws-access-key}
    secret-key: ${AWS_SECRET_KEY:local-aws-secret-key}
    region: ap-northeast-2
    bucket: forday-s3-bucket
    endpoint: s3.ap-northeast-2.amazonaws.com

lambda:
  create-cover-function-name: dummy-local-function
  # 로컬은 alias가 없으므로 비워둔다(=qualifier 미지정, $LATEST). 운영은 ForDay_Infra가
  # 만든 prod alias를 참조해야 하므로 prod 값 주입 시 create-cover-function-alias: prod 필요 - 이슈 #356
  create-cover-function-alias:
  # 실제 콜드 스타트 분포(p99) 측정 전 잠정치. 측정 후 조정 대상 - 이슈 #357
  api-call-attempt-timeout-seconds: 10
  api-call-timeout-seconds: 20
  max-retries: 1
