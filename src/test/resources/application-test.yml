spring:
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      # 테스트는 전용 DB를 쓴다. IntegrationTestSupport가 매 테스트 전에 flushDb를
      # 호출하므로, 개발용 데이터가 들어 있는 0번과 반드시 분리해야 한다.
      database: 1

  jwt:
    secret: test-secret
    access-expiration: 180
    refresh-expiration: 7
